name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Both packages enforce Node 24 LTS; Firebase 13 requires Node >=24.12.0.
  NODE_VERSION: '24.22.0'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # tests/unit/artifact.test.ts checks the packaged dist/, so build first.
      - run: npm run build
      - run: npm test
      - run: npm run audit:secrets
      - run: node ../scripts/prepare-release-candidate.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Same emulator-only public config as local development; no real keys.
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:dependencies
      - run: npm run build

  # The API contract exists in four committed files. Each must match its source:
  # backend code -> backend/docs/api/openapi.json -> frontend/contract/openapi.json,
  # and each openapi.json -> its generated TypeScript types.
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: OpenAPI matches backend routes
        run: npm run check:openapi
      - name: Frontend contract copy matches backend OpenAPI
        run: |
          cmp docs/api/openapi.json ../frontend/contract/openapi.json \
            || { echo "::error::frontend/contract/openapi.json is stale. Run 'npm run api:sync' in frontend."; exit 1; }
      - name: Generated types match OpenAPI
        run: |
          npx openapi-typescript docs/api/openapi.json -o "$RUNNER_TEMP/backend-types.ts"
          diff -q docs/api/generated-types.ts "$RUNNER_TEMP/backend-types.ts" \
            || { echo "::error::backend/docs/api/generated-types.ts is stale. Run 'npm run types:api' in backend."; exit 1; }
          npx openapi-typescript ../frontend/contract/openapi.json -o "$RUNNER_TEMP/frontend-schema.d.ts"
          diff -q ../frontend/src/api/schema.d.ts "$RUNNER_TEMP/frontend-schema.d.ts" \
            || { echo "::error::frontend/src/api/schema.d.ts is stale. Run 'npm run api:sync' in frontend."; exit 1; }
